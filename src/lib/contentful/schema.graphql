"""
Snapshot of the Contentful GraphQL Content Delivery schema for this space.

Contentful generates this schema from the content model in
`contentful/migrations/001-initial-content-model.cjs`. The snapshot exists so
that codegen — and therefore every type the app is built against — works before
the space exists, and so that schema drift is a reviewable diff rather than a
runtime surprise.

Keeping it honest: once real credentials land, run

    CONTENTFUL_SCHEMA_FROM_API=1 npm run codegen

which introspects the live endpoint instead. Any difference between the live
schema and this file shows up immediately as a codegen or typecheck failure.

Only the subset the app actually queries is modelled. Required model fields are
non-null here, matching how Contentful marks them; optional fields stay nullable
— which is exactly what makes the "before image absent" case (a documented
acceptance criterion) impossible to forget.
"""
scalar DateTime
scalar Dimension
scalar HexColor
scalar JSON
scalar Quality

type Sys {
  id: String!
  spaceId: String!
  environmentId: String!
  publishedAt: DateTime
  firstPublishedAt: DateTime
  publishedVersion: Int
}

input SysFilter {
  id: String
  id_in: [String]
  publishedAt_exists: Boolean
}

enum ImageFormat {
  JPG
  JPG_PROGRESSIVE
  PNG
  PNG8
  WEBP
  AVIF
}

enum ImageResizeStrategy {
  FIT
  PAD
  FILL
  SCALE
  CROP
  THUMB
}

enum ImageResizeFocus {
  CENTER
  TOP
  TOP_RIGHT
  TOP_LEFT
  BOTTOM
  BOTTOM_RIGHT
  BOTTOM_LEFT
  RIGHT
  LEFT
  FACE
  FACES
}

input ImageTransformOptions {
  width: Dimension
  height: Dimension
  quality: Quality
  cornerRadius: Int
  resizeStrategy: ImageResizeStrategy
  resizeFocus: ImageResizeFocus
  backgroundColor: HexColor
  format: ImageFormat
}

type Asset {
  sys: Sys!
  title: String
  description: String
  contentType: String
  fileName: String
  size: Int
  url(transform: ImageTransformOptions): String
  width: Int
  height: Int
}

# ── plant ─────────────────────────────────────────────────────────────────────

type Plant {
  sys: Sys!
  commonName: String!
  latinName: String!
  photo: Asset!
  photoAltText: String!
  photoCaption: String
  lightTag: String!
  waterTag: String!
  isNative: Boolean!
  featured: Boolean!
  order: Int!
}

type PlantCollection {
  total: Int!
  skip: Int!
  limit: Int!
  items: [Plant]!
}

input PlantFilter {
  sys: SysFilter
  featured: Boolean
  isNative: Boolean
  lightTag: String
  lightTag_in: [String]
  waterTag: String
  waterTag_in: [String]
}

enum PlantOrder {
  order_ASC
  order_DESC
  commonName_ASC
  commonName_DESC
  sys_publishedAt_ASC
  sys_publishedAt_DESC
}

# ── project ───────────────────────────────────────────────────────────────────

type ProjectBody {
  json: JSON!
  links: ProjectBodyLinks!
}

type ProjectBodyLinks {
  assets: ProjectBodyAssets!
}

type ProjectBodyAssets {
  block: [Asset]!
  hyperlink: [Asset]!
}

type Project {
  sys: Sys!
  title: String!
  slug: String!
  caption: String!
  location: String!
  date: DateTime!
  summary: String
  beforeImage: Asset
  beforeImageAltText: String
  beforeImageCaption: String
  afterImage: Asset!
  afterImageAltText: String!
  afterImageCaption: String
  body: ProjectBody
  metaDescription: String
  ctaHeading: String
  ctaBody: String
  ctaLabel: String
}

type ProjectCollection {
  total: Int!
  skip: Int!
  limit: Int!
  items: [Project]!
}

input ProjectFilter {
  sys: SysFilter
  slug: String
  slug_in: [String]
}

enum ProjectOrder {
  date_ASC
  date_DESC
  title_ASC
  title_DESC
  sys_publishedAt_ASC
  sys_publishedAt_DESC
}

