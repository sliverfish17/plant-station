type SiteSettings {
  sys: Sys!
  internalName: String!
  heroImageDesktop: Asset!
  heroImageDesktopAltText: String!
  heroImageDesktopCaption: String
  heroImageMobile: Asset!
  heroImageMobileAltText: String!
  heroImageMobileCaption: String
  portrait: Asset!
  portraitAltText: String!
  portraitCaption: String
}

type SiteSettingsCollection {
  total: Int!
  skip: Int!
  limit: Int!
  items: [SiteSettings]!
}

input SiteSettingsFilter {
  sys: SysFilter
}

# ── Query ─────────────────────────────────────────────────────────────────────

type Query {
  plantCollection(
    skip: Int = 0
    limit: Int = 100
    preview: Boolean
    locale: String
    where: PlantFilter
    order: [PlantOrder]
  ): PlantCollection

  projectCollection(
    skip: Int = 0
    limit: Int = 100
    preview: Boolean
    locale: String
    where: ProjectFilter
    order: [ProjectOrder]
  ): ProjectCollection

  blogPostCollection(
    skip: Int = 0
    limit: Int = 100
    preview: Boolean
    locale: String
    where: BlogPostFilter
    order: [BlogPostOrder]
  ): BlogPostCollection

  testimonialCollection(
    skip: Int = 0
    limit: Int = 100
    preview: Boolean
    locale: String
    where: TestimonialFilter
    order: [TestimonialOrder]
  ): TestimonialCollection

  serviceCollection(
    skip: Int = 0
    limit: Int = 100
    preview: Boolean
    locale: String
    where: ServiceFilter
    order: [ServiceOrder]
  ): ServiceCollection

  siteSettingsCollection(
    skip: Int = 0
    limit: Int = 1
    preview: Boolean
    locale: String
    where: SiteSettingsFilter
  ): SiteSettingsCollection
}
